<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3e9">
  <meta name="description" content="모니터를 뚫고 튀어나온 케로로 소대! 화면을 움직이고 캐릭터를 눌러 즐기는 인터랙티브 포스터.">
  <title>개구리 중사 케로로 — 소대 출동!</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./animations.css">
  <link rel="preload" href="./assets/keroro.png" as="image">
  <link rel="preload" href="./assets/title-ko.png" as="image">
</head>
<body>
  <a class="skip-link" href="#replay">재생 제어로 건너뛰기</a>
  <svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="icon-star" viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.8l-6.2 3.3L7 14.2 2 9.3l6.9-1Z"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h15M13 5l7 7-7 7"/></symbol>
    <symbol id="icon-replay" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1.5 7M3 4v6h6"/></symbol>
    <symbol id="icon-sound" viewBox="0 0 24 24"><path d="M11 4 6 8H3v8h3l5 4ZM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></symbol>
    <symbol id="icon-mute" viewBox="0 0 24 24"><path d="M11 4 6 8H3v8h3l5 4ZM16 9l6 6m0-6-6 6"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
  </defs></svg>
  <header class="site-header">
    <span class="brand"><span class="brand-mark" aria-hidden="true">★</span><b>케로로 소대</b></span>
    <button type="button" class="sound-button" aria-label="효과음 켜기" aria-pressed="false"><svg><use href="#icon-mute"/></svg><span>효과음 꺼짐</span></button>
  </header>
  <main id="main" aria-label="케로로 인터랙티브 포스터">
    <section class="hero" aria-labelledby="hero-title">
      <div class="scene" id="scene" data-state="loading">
        <div class="scene-background" aria-hidden="true">
          <div class="halftone halftone-left"></div><div class="halftone halftone-right"></div>
          <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
          <svg class="rainbow" viewBox="0 0 1400 800" preserveAspectRatio="none"><g fill="none" stroke-width="12"><path d="M-100 750C550 800 700 0 1500 90" stroke="#b7d6a0"/><path d="M-100 766C550 816 700 16 1500 106" stroke="#f6dd72"/><path d="M-100 782C550 832 700 32 1500 122" stroke="#efb5aa"/><path d="M-100 798C550 848 700 48 1500 138" stroke="#a7d3dc"/></g></svg>
          <div class="giant-star">☆</div>
          <span class="doodle star-a">✦</span><span class="doodle star-b">✧</span><span class="doodle star-c">★</span><span class="doodle star-d">✧</span>
          <span class="doodle note-a">♪</span><span class="doodle note-b">♫</span>
          <span class="doodle circle-a"></span><span class="doodle circle-b"></span>
          <span class="confetti-piece confetti-a"></span><span class="confetti-piece confetti-b"></span><span class="confetti-piece confetti-c"></span><span class="confetti-piece confetti-d"></span>
          <span class="little-cross cross-a">+</span><span class="little-cross cross-b">+</span>
        </div>
        <div class="impact-lines" aria-hidden="true"></div>
        <button class="monitor" id="monitor" type="button" aria-label="모니터에서 케로로 소대 다시 출동시키기">
          <span class="monitor-body"><span class="monitor-screen"><span class="scanlines"></span><span class="screen-star">★</span><span class="screen-copy">케론 통신</span><span class="screen-status">연결 중…</span><span class="screen-flash"></span></span><span class="monitor-chin"><span>케론 테크놀로지</span><i></i></span></span>
          <span class="monitor-neck"></span><span class="monitor-foot"></span><span class="monitor-cable"></span>
          <span class="monitor-caption">눌러서 다시 출동! <span>↗</span></span>
        </button>
        <div inert class="character character-giroro" data-character="giroro">
          <button class="character-hit" type="button" aria-label="기로로와 놀기"><img src="./assets/giroro.png" width="1280" height="1280" alt="기로로" fetchpriority="high"><span class="character-label">기로로</span></button>
        </div>
        <div inert class="character character-tamama" data-character="tamama">
          <button class="character-hit" type="button" aria-label="타마마와 놀기"><img src="./assets/tamama.png" width="1280" height="1280" alt="타마마" fetchpriority="high"><span class="character-label">타마마</span></button>
        </div>
        <div inert class="character character-kururu" data-character="kururu">
          <button class="character-hit" type="button" aria-label="쿠루루와 놀기"><img src="./assets/kururu.png" width="1280" height="1280" alt="쿠루루" fetchpriority="high"><span class="character-label">쿠루루</span></button>
        </div>
        <div inert class="character character-dororo" data-character="dororo">
          <button class="character-hit" type="button" aria-label="도로로와 놀기"><img src="./assets/dororo.png" width="1280" height="1280" alt="도로로" fetchpriority="high"><span class="character-label">도로로</span></button>
        </div>
        <div inert class="character character-keroro" data-character="keroro">
          <button class="character-hit" type="button" aria-label="케로로와 놀기"><img src="./assets/keroro.png" width="1280" height="1280" alt="케로로" fetchpriority="high"><span class="character-label">케로로</span></button>
        </div>
        <div inert class="title-lockup"><h1 id="hero-title"><img src="./assets/title-ko.png" width="1920" height="800" alt="개구리 중사 케로로" fetchpriority="high"></h1></div>
        <div class="speech-bubble">지구 정복,<br><b>시작합니다!</b><span>★</span></div>
        <div id="particles" aria-hidden="true"></div>
        <div class="loading-message" role="status"><span class="loading-star">★</span><span>소대원들과 연결 중…</span></div>
      </div>
    </section>
  </main>
  <div class="scene-toolbar" role="group" aria-label="애니메이션 제어">
    <div class="mission-status"><span class="status-dot"></span><span class="status-text" aria-live="polite">소대 연결 중</span></div>
    <div class="playback-controls">
      <button type="button" id="pause" class="icon-button" aria-label="애니메이션 일시정지" disabled><svg><use href="#icon-pause"/></svg></button>
      <div class="progress-track" role="progressbar" aria-label="등장 애니메이션 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
      <button type="button" id="skip" class="text-button" disabled>건너뛰기 <span>→</span></button>
      <button type="button" id="replay" class="replay-button" disabled><svg><use href="#icon-replay"/></svg> 다시 출동!</button>
    </div>
    <p class="interaction-hint">캐릭터를 톡! 화면을 움직여 보세요.</p>
  </div>
  <noscript><p class="noscript-note">움직이는 포스터를 보려면 JavaScript를 켜 주세요.</p></noscript>
  <audio id="pop-sound" src="./assets/pop.wav" preload="auto"></audio>
  <audio id="finale-sound" src="./assets/finale.wav" preload="auto"></audio>
  <script defer src="./src/vendor/jquery-3.7.1.min.js"></script>
  <script defer src="./src/main.js"></script>
</body>
</html>
